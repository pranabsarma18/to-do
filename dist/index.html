<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="609a232ab53e413e38d2.css"><script defer="defer" src="main.js"></script></head><body><header><h1>TO-DO APP: A friendly way to schedule your tasks</h1></header><nav class="sidebar"><h3>ADD NEW PROJECTS/ TO-DOs:</h3><div class="project-todo-add"><button id="add-project">Add Project</button><dialog id="project-dialog"><form id="project-form"><label for="project-name">Project Name:</label> <input id="project-name" name="project-name" required> <button type="submit">Add Project</button></form><button commandfor="project-dialog" command="close">Cancel</button></dialog><button id="add-todo">Add TODOs</button><dialog id="todo-dialog"><form id="todo-form"><label for="title">Title:</label> <input id="title" name="title"> <label for="project">Project:</label> <select name="project" id="project"><option value="" disabled="disabled" selected="selected">--Please choose a project--</option></select> <label for="description">Description:</label> <textarea id="description" name="description"></textarea> <label for="due">Due Date:</label> <input type="date" id="due" name="due"> <label for="notes">Notes:</label> <textarea id="notes" name="notes"></textarea> <label for="priority">Priority:</label> <select name="priority" id="priority"><option value="High">High</option><option value="Medium" selected="selected">Medium</option><option value="Low">Low</option></select> <button type="submit">Add TODO</button></form><button commandfor="todo-dialog" command="close">Cancel</button></dialog></div><h3>PROJECTS:</h3><div class="projects"></div></nav><div class="main"><h3>LIST of TO-DOs:</h3><div class="todos"></div></div></body></html>
